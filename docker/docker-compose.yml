version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sams-postgres
    environment:
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: sams_dev
      POSTGRES_DB: sams
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sams -d sams']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
